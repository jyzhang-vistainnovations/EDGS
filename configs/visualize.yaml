defaults:
  - gs: base
  - _self_

dataset:
  densify_until_iter: 15000
  source_path: "/app/data/captures/test_apr29_1"
  model_path: "/app/data/gs/EDGS/test_apr29_1"
  images: images
  resolution: -1
  white_background: false
  data_device: cuda
  eval: true
  depths: ""
  train_test_exp: False

load:
  gs: "/app/data/gs/EDGS/test_apr29_1" #path to 3dgs checkpoint
  gs_step: 7000 #number of iterations, e.g. 7000

device: "cuda:0"
verbose: true

train:
  gs_epochs: 0 # number of 3dgs iterations
  reduce_opacity: True
  no_densify: False # if True, the model will not be densified
  max_lr: True

init_wC:
  use: True # use EDGS
  matches_per_ref: 15_000 # number of matches per reference
  num_refs: 180 # number of reference images
  nns_per_ref: 3 # number of nearest neighbors per reference
  scaling_factor: 0.001
  proj_err_tolerance: 0.01
  roma_model: "outdoors" # you can change this to "indoors" or "outdoors"
  add_SfM_init: False
